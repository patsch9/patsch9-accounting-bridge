name: Fix reconciliation update race

on:
  push:
    branches:
      - feature/historical-invoice-reconciliation
    paths:
      - '.github/workflows/fix-reconciliation-race.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/historical-invoice-reconciliation
      - name: Apply race-condition guard
        shell: python
        run: |
          from pathlib import Path
          path = Path('includes/class-invoice-reconciler.php')
          text = path.read_text(encoding='utf-8')

          old_stats = "            'skipped_manual' => 0,\n            'errors' => 0,\n"
          new_stats = "            'skipped_manual' => 0,\n            'skipped_update' => 0,\n            'errors' => 0,\n"
          if text.count(old_stats) != 1:
              raise SystemExit(f'Expected one stats block, got {text.count(old_stats)}')
          text = text.replace(old_stats, new_stats, 1)

          old_loop = "            if ('yes' === $order->get_meta('_wlc_skip_auto_reconciliation')) {\n                $stats['skipped_manual']++;\n                continue;\n            }\n\n            $created = $order->get_date_created();\n"
          new_loop = "            if ('yes' === $order->get_meta('_wlc_skip_auto_reconciliation')) {\n                $stats['skipped_manual']++;\n                continue;\n            }\n\n            if ($order->get_meta('_wlc_lexware_update_source_invoice_id')) {\n                $stats['skipped_update']++;\n                continue;\n            }\n\n            $created = $order->get_date_created();\n"
          if text.count(old_loop) != 1:
              raise SystemExit(f'Expected one batch guard block, got {text.count(old_loop)}')
          text = text.replace(old_loop, new_loop, 1)

          old_direct = "        if ('yes' === $order->get_meta('_wlc_skip_auto_reconciliation')) {\n            return null;\n        }\n\n        if (!$api_client instanceof WLC_API_Client) {\n"
          new_direct = "        if ('yes' === $order->get_meta('_wlc_skip_auto_reconciliation')) {\n            return null;\n        }\n\n        if ($order->get_meta('_wlc_lexware_update_source_invoice_id')) {\n            return null;\n        }\n\n        if (!$api_client instanceof WLC_API_Client) {\n"
          if text.count(old_direct) != 1:
              raise SystemExit(f'Expected one direct reconciliation guard block, got {text.count(old_direct)}')
          text = text.replace(old_direct, new_direct, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-reconciliation-race.yml').unlink()
      - name: Verify syntax
        shell: bash
        run: php -l includes/class-invoice-reconciler.php
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard historical reconciliation during invoice replacement"
          git push origin HEAD:feature/historical-invoice-reconciliation
