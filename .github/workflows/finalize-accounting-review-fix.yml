name: Finalize accounting review fix

on:
  push:
    branches:
      - fix/accounting-review-2026-11

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Apply final corrections
        run: python3 .github/scripts/finalize_accounting_review_fix.py

      - name: Validate changed code
        shell: bash
        run: |
          php -l includes/class-woo-lexware-integration.php
          php -l includes/class-lexware-api-client.php
          php -l includes/class-queue-handler.php
          php -l uninstall.php
          php -l tests/test-upgrade-locks.php
          php tests/test-rental-meta.php
          php tests/test-payment-policy.php
          git diff --check

      - name: Commit final corrections
        shell: bash
        run: |
          rm -f .github/workflows/finalize-accounting-review-fix.yml
          rm -f .github/scripts/finalize_accounting_review_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: make manual save dedupe retry-safe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
