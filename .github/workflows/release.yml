name: Build and publish release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source provenance
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*(-(alpha|beta)[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tag must be YYYY.MM.N, YYYY.MM.N-alphaN or YYYY.MM.N-betaN."
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

          prerelease=false
          if [[ "$tag" == *-alpha* || "$tag" == *-beta* ]]; then
            prerelease=true
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Build installable package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SLUG: patsch9-accounting-bridge
        run: |
          set -euo pipefail
          rm -rf .release-build
          mkdir -p ".release-build/$SLUG"
          rsync -a --delete --exclude-from=.distignore ./ ".release-build/$SLUG/"

          test -f ".release-build/$SLUG/patsch9-accounting-bridge.php"
          test -f ".release-build/$SLUG/readme.txt"
          test -f ".release-build/$SLUG/LICENSE"

          if find ".release-build/$SLUG" -type l -print -quit | grep -q .; then
            echo "::error::Release packages must not contain symbolic links."
            exit 1
          fi

          for forbidden in .git .github .distignore README.md CHANGELOG.md DOCUMENTATION.md MIGRATION.md SECURITY.md VERSIONING.md; do
            if [[ -e ".release-build/$SLUG/$forbidden" ]]; then
              echo "::error::Repository-only file leaked into release package: $forbidden"
              exit 1
            fi
          done

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path('.release-build') / os.environ['SLUG']
          version = os.environ['VERSION']
          plugin_path = root / 'patsch9-accounting-bridge.php'
          readme_path = root / 'readme.txt'

          plugin = plugin_path.read_text(encoding='utf-8')
          plugin, header_count = re.subn(
              r'(^\s*\*\s*Version:\s*)[^\s]+',
              lambda match: match.group(1) + version,
              plugin,
              count=1,
              flags=re.MULTILINE,
          )
          plugin, constant_count = re.subn(
              r"(define\(\s*'PATSACBR_VERSION'\s*,\s*')[^']+('\s*\)\s*;)",
              lambda match: match.group(1) + version + match.group(2),
              plugin,
              count=1,
          )
          if header_count != 1 or constant_count != 1:
              raise SystemExit('Could not set plugin release version exactly once.')
          plugin_path.write_text(plugin, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme, stable_count = re.subn(
              r'(^Stable tag:\s*)[^\s]+',
              lambda match: match.group(1) + version,
              readme,
              count=1,
              flags=re.MULTILINE,
          )
          if stable_count != 1:
              raise SystemExit('Could not set Stable tag exactly once.')
          readme_path.write_text(readme, encoding='utf-8')

          languages = root / 'languages'
          if languages.is_dir():
              catalog_pattern = re.compile(
                  r'^("Project-Id-Version: Patsch9 Accounting Bridge for WooCommerce )[^\\]+(\\n")$',
                  re.MULTILINE,
              )
              for catalog in sorted(languages.glob('*.po*')):
                  text = catalog.read_text(encoding='utf-8')
                  if '"Project-Id-Version:' not in text:
                      continue
                  text, count = catalog_pattern.subn(
                      lambda match: match.group(1) + version + match.group(2),
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'Could not set Project-Id-Version in {catalog.name}.')
                  catalog.write_text(text, encoding='utf-8')

          final_plugin = plugin_path.read_text(encoding='utf-8')
          header = re.search(r'^\s*\*\s*Version:\s*([^\s]+)', final_plugin, re.MULTILINE).group(1)
          constant = re.search(r"define\(\s*'PATSACBR_VERSION'\s*,\s*'([^']+)'", final_plugin).group(1)
          stable = re.search(r'^Stable tag:\s*([^\s]+)', readme_path.read_text(encoding='utf-8'), re.MULTILINE).group(1)
          if len({version, header, constant, stable}) != 1:
              raise SystemExit('Generated package does not contain consistent tag-derived version metadata.')
          PY

          find ".release-build/$SLUG" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find ".release-build/$SLUG" -type f -name '*.js' -print0)

          (
            cd .release-build
            zip -X -q -r "../${SLUG}-${VERSION}.zip" "$SLUG"
          )
          sha256sum "${SLUG}-${VERSION}.zip" > "${SLUG}-${VERSION}.zip.sha256"

      - name: WordPress Plugin Check on release package
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: .release-build/patsch9-accounting-bridge
          strict: true

      - name: Store release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            patsch9-accounting-bridge-${{ steps.version.outputs.version }}.zip
            patsch9-accounting-bridge-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SLUG: patsch9-accounting-bridge
          RELEASE_TITLE: Patsch9 Accounting Bridge for WooCommerce
        run: |
          set -euo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            "${SLUG}-${VERSION}.zip"
            "${SLUG}-${VERSION}.zip.sha256"
            --repo "$GH_REPO"
            --verify-tag
            --title "${RELEASE_TITLE} ${VERSION}"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"

  cleanup:
    name: Published build artifacts entfernen
    needs: publish
    uses: ./.github/workflows/cleanup-artifacts.yml # zizmor: ignore[self-repository] -- Same-commit reusable workflow.
    with:
      run_id: ${{ github.run_id }}
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      actions: write
