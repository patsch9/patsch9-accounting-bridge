name: Refresh 2026.10.8 translation catalog

on:
  push:
    branches:
      - fix/2026.10.8-tax-temp-hardening
    paths:
      - .github/workflows/refresh-2026-10-8-catalog.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2026.10.8-tax-temp-hardening
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: wp-cli:2.12.0
          coverage: none
      - name: Refresh gettext catalogs
        shell: bash
        run: |
          wp i18n make-pot . languages/patsch9-accounting-bridge.pot --domain=patsch9-accounting-bridge --slug=patsch9-accounting-bridge --exclude=.github,tests
          wp i18n update-po languages/patsch9-accounting-bridge.pot languages/patsch9-accounting-bridge-de_DE.po
          wp i18n make-mo languages/patsch9-accounting-bridge-de_DE.po languages/patsch9-accounting-bridge-de_DE.mo
          python3 tests/check-translations.py
      - name: Commit refreshed catalogs and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/refresh-2026-10-8-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh translations for 2026.10.8"
          git push origin HEAD:fix/2026.10.8-tax-temp-hardening
