name: Deploy to WordPress.org

on:
  workflow_run:
    workflows:
      - Build and publish release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag to deploy (YYYY.MM.N)
        required: true
        type: string

concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          release_re='^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*(-(alpha|beta)[1-9][0-9]*)?$'
          stable_re='^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
            if [[ ! "$tag" =~ $stable_re ]]; then
              echo "::error::Manual WordPress.org deploys accept only stable YYYY.MM.N tags."
              exit 1
            fi
          else
            mapfile -t release_tags < <(git tag --points-at "$WORKFLOW_SHA" | grep -E "$release_re" || true)
            if [[ ${#release_tags[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one valid release tag on completed release SHA $WORKFLOW_SHA; found ${#release_tags[@]}."
              exit 1
            fi
            tag="${release_tags[0]}"
          fi

          stable=true
          if [[ ! "$tag" =~ $stable_re ]]; then
            stable=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

          if [[ "$stable" != "true" ]]; then
            echo "Prerelease $tag detected; WordPress.org deploy is intentionally skipped."
          fi

      - name: Validate release provenance
        if: steps.release.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n1 "$TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::The release tag must point to a commit contained in main."
            exit 1
          fi

          release_json="$(gh release view "$TAG" --repo "$GH_REPO" --json tagName,isDraft,isPrerelease)"
          if [[ "$(jq -r '.tagName' <<< "$release_json")" != "$TAG" ]]; then
            echo "::error::GitHub release tag mismatch."
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "false" || "$(jq -r '.isPrerelease' <<< "$release_json")" != "false" ]]; then
            echo "::error::Drafts and prereleases are not deployed to WordPress.org."
            exit 1
          fi

      - name: Download and verify GitHub release package
        if: steps.release.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SLUG: patsch9-accounting-bridge
        run: |
          set -euo pipefail

          zip_name="${SLUG}-${VERSION}.zip"
          rm -rf .wporg-package .wporg-build
          mkdir -p .wporg-package .wporg-build

          gh release download "$TAG" \
            --repo "$GH_REPO" \
            --pattern "$zip_name" \
            --pattern "$zip_name.sha256" \
            --dir .wporg-package

          (
            cd .wporg-package
            sha256sum -c "$zip_name.sha256"
          )

          unzip -q ".wporg-package/$zip_name" -d .wporg-build
          test -f ".wporg-build/$SLUG/patsch9-accounting-bridge.php"
          test -f ".wporg-build/$SLUG/readme.txt"
          test -f ".wporg-build/$SLUG/LICENSE"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          slug = os.environ['SLUG']
          root = Path('.wporg-build') / slug
          plugin = (root / 'patsch9-accounting-bridge.php').read_text(encoding='utf-8')
          readme = (root / 'readme.txt').read_text(encoding='utf-8')

          header = re.search(r'^\s*\*\s*Version:\s*([^\s]+)', plugin, re.MULTILINE)
          constant = re.search(r"define\(\s*'PATSACBR_VERSION'\s*,\s*'([^']+)'", plugin)
          stable = re.search(r'^Stable tag:\s*([^\s]+)\s*$', readme, re.MULTILINE)
          if not header or not constant or not stable:
              raise SystemExit('Could not read version metadata from verified release package.')
          values = {version, header.group(1), constant.group(1), stable.group(1)}
          if len(values) != 1:
              raise SystemExit(
                  'WordPress.org package metadata differs: '
                  f'version={version}, header={header.group(1)}, '
                  f'constant={constant.group(1)}, stable_tag={stable.group(1)}'
              )
          PY

      - name: Load and validate current WordPress.org assets
        if: steps.release.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # WordPress.org assets are global directory assets rather than versioned
          # plugin code. The current main ref was fetched during provenance validation.
          rm -rf .wordpress-org
          git restore --source=refs/remotes/origin/main -- .wordpress-org

          python3 <<'PY'
          import struct
          import sys
          from pathlib import Path

          expected = {
              '.wordpress-org/icon-128x128.png': (128, 128),
              '.wordpress-org/icon-256x256.png': (256, 256),
              '.wordpress-org/banner-772x250.png': (772, 250),
              '.wordpress-org/banner-1544x500.png': (1544, 500),
          }

          for filename, dimensions in expected.items():
              path = Path(filename)
              if not path.is_file():
                  print(f'::error::Missing WordPress.org asset: {filename}')
                  sys.exit(1)

              data = path.read_bytes()
              if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  print(f'::error::{filename} is not a valid PNG file.')
                  sys.exit(1)

              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dimensions:
                  print(
                      f'::error::{filename} has {width}x{height}; '
                      f'expected {dimensions[0]}x{dimensions[1]}.'
                  )
                  sys.exit(1)
          PY

      - name: Deploy verified package to WordPress.org SVN
        if: steps.release.outputs.stable == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: patsch9-accounting-bridge
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_DIR: .wporg-build/patsch9-accounting-bridge
