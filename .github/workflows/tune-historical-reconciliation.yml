name: Tune historical reconciliation

on:
  push:
    branches:
      - feature/historical-invoice-reconciliation
    paths:
      - '.github/workflows/tune-historical-reconciliation.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/historical-invoice-reconciliation
      - name: Apply review adjustments
        shell: python
        run: |
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          once(
              'includes/class-invoice-reconciler.php',
              "    const BATCH_SIZE = 20;\n",
              "    const BATCH_SIZE = 10;\n",
          )
          once(
              'includes/class-lexware-api-client.php',
              "    $order_number = trim((string) $order_number);\n",
              "    $order_number = $this->normalize_reconciliation_text((string) $order_number);\n",
          )
          Path('.github/workflows/tune-historical-reconciliation.yml').unlink()
      - name: Verify PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit adjustments
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune reconciliation batching and order-number matching"
          git push origin HEAD:feature/historical-invoice-reconciliation
