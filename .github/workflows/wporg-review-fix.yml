name: WordPress.org review remediation

on:
  push:
    branches:
      - 'fix/wporg-review-2026-10-09'

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --branch "$GITHUB_REF_NAME" --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 .github/scripts/wporg_review_fix.py
          rm -f .github/scripts/wporg_review_fix.py .github/workflows/wporg-review-fix.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              cleaned = re.sub(r'[ \t]+$', '', text, flags=re.MULTILINE)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Commit fixes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix WordPress.org pre-review findings'
          git push origin HEAD:"$GITHUB_REF_NAME"
