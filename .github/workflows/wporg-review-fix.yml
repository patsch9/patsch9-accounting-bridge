name: WordPress.org review remediation

on:
  push:
    branches:
      - 'fix/wporg-review-2026-10-09'

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/wporg-review-2026-10-09
          fetch-depth: 0

      - name: Apply WordPress.org review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          php_files = list(root.rglob('*.php'))
          source_before = '\n'.join(p.read_text(encoding='utf-8') for p in php_files)

          option_suffixes = set()
          option_patterns = [
              r"\b(?:get_option|update_option|add_option|delete_option)\s*\(\s*['\"]wlc_([A-Za-z0-9_-]+)['\"]",
              r"\bregister_setting\s*\(\s*['\"][^'\"]+['\"]\s*,\s*['\"]wlc_([A-Za-z0-9_-]+)['\"]",
          ]
          for pattern in option_patterns:
              option_suffixes.update(re.findall(pattern, source_before))
          option_suffixes = sorted(s for s in option_suffixes if s and not s.endswith('_'))

          meta_suffixes = sorted(set(re.findall(r"['\"]_wlc_([A-Za-z0-9_-]+)['\"]", source_before)))

          # Remove hard-coded admin assets reported by the WordPress.org review.
          admin_settings = root / 'includes/class-admin-settings.php'
          text = admin_settings.read_text(encoding='utf-8')
          text, count = re.subn(r"\n\s*<script>.*?</script>\s*", "\n", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected exactly one inline <script> block in class-admin-settings.php')
          admin_settings.write_text(text, encoding='utf-8')

          integration = root / 'includes/class-woo-lexware-integration.php'
          text = integration.read_text(encoding='utf-8')
          text, style_count = re.subn(r"\n\s*<style>.*?</style>\s*", "\n", text, count=1, flags=re.S)
          text, script_count = re.subn(r"\n\s*<script>.*?</script>\s*", "\n", text, count=1, flags=re.S)
          if style_count != 1 or script_count != 1:
              raise SystemExit(f'Expected one metabox style/script block, got style={style_count}, script={script_count}')
          integration.write_text(text, encoding='utf-8')

          # Move every active plugin-owned identifier to the unique review-safe prefix.
          text_suffixes = {'.php', '.js', '.css', '.md', '.txt', '.yml', '.yaml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              if path.as_posix() == '.github/workflows/wporg-review-fix.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('WLC_', 'PATSACBR_')
              text = text.replace('wlc_', 'patsacbr_')
              text = text.replace('wlc-', 'patsacbr-')
              text = text.replace('LEXWARE_CONNECTOR_API_KEY', 'PATSACBR_LEXWARE_API_KEY')
              path.write_text(text, encoding='utf-8')

          # Version and WordPress.org header normalization.
          main = root / 'patsch9-accounting-bridge.php'
          text = main.read_text(encoding='utf-8')
          text = text.replace(' * Version: 2026.10.2', ' * Version: 2026.10.3')
          text = text.replace("define('PATSACBR_VERSION', '2026.10.2');", "define('PATSACBR_VERSION', '2026.10.3');")
          text = text.replace("define('PATSACBR_DB_VERSION', '1.3.6');", "define('PATSACBR_DB_VERSION', '1.4.0');")
          text = text.replace(' * Requires at least: 6.9.5', ' * Requires at least: 6.9')
          text = text.replace('WordPress 6.9.5 oder höher', 'WordPress 6.9 oder höher')
          text = text.replace("version_compare((string) $wp_version, '6.9.5', '<')", "version_compare((string) $wp_version, '6.9', '<')")
          text = text.replace('// WordPress-Sicherheitsbasis prüfen (6.9.5 enthält die Backports für die im Juli 2026 behobenen Core-Lücken).', '// Niedrigste unterstützte WordPress-Hauptversion prüfen.')

          require_marker = "define('PATSACBR_PLUGIN_BASENAME', plugin_basename(__FILE__));\n"
          if "class-legacy-migration.php" not in text:
              text = text.replace(require_marker, require_marker + "\nrequire_once PATSACBR_PLUGIN_DIR . 'includes/class-legacy-migration.php';\n")

          init_marker = "        if (!defined('WC_VERSION') || version_compare(WC_VERSION, '10.9.4', '<')) {\n            add_action('admin_notices', array($this, 'woocommerce_version_notice'));\n            return;\n        }\n"
          if 'PATSACBR_Legacy_Migration::run();' not in text:
              text = text.replace(init_marker, init_marker + "\n        // Migrate pre-directory identifiers before any settings or order metadata are read.\n        PATSACBR_Legacy_Migration::run();\n")

          db_marker = "        dbDelta($sql);\n        update_option('patsacbr_db_version', PATSACBR_DB_VERSION, false);"
          if 'migrate_queue_table' not in text:
              text = text.replace(db_marker, "        dbDelta($sql);\n        PATSACBR_Legacy_Migration::migrate_queue_table();\n        update_option('patsacbr_db_version', PATSACBR_DB_VERSION, false);")

          # Keep dependency notices useful but scoped to the Plugins screen (Guideline 11).
          version_notice = "    public function woocommerce_version_notice() {\n        echo '<div class=\"notice notice-error\"><p>' . esc_html__('Patsch9 Accounting Bridge benötigt WooCommerce 10.9.4 oder höher.', 'patsch9-accounting-bridge') . '</p></div>'; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped -- escaped above.\n    }"
          version_replacement = "    private function should_show_dependency_notice() {\n        if (!is_admin() || !function_exists('get_current_screen')) {\n            return false;\n        }\n        $screen = get_current_screen();\n        return $screen && 'plugins' === $screen->id;\n    }\n\n    public function woocommerce_version_notice() {\n        if (!$this->should_show_dependency_notice()) {\n            return;\n        }\n        echo '<div class=\"notice notice-error\"><p>' . esc_html__('Patsch9 Accounting Bridge benötigt WooCommerce 10.9.4 oder höher.', 'patsch9-accounting-bridge') . '</p></div>'; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped -- escaped above.\n    }"
          text = text.replace(version_notice, version_replacement)

          missing_start = "    public function woocommerce_missing_notice() {\n        ?>"
          text = text.replace(missing_start, "    public function woocommerce_missing_notice() {\n        if (!$this->should_show_dependency_notice()) {\n            return;\n        }\n        ?>")
          main.write_text(text, encoding='utf-8')

          # Static settings script.
          js_dir = root / 'admin/js'
          js_dir.mkdir(parents=True, exist_ok=True)
          (js_dir / 'admin-settings.js').write_text(r'''(function ($) {
              'use strict';

              $(function () {
                  var input = $('#patsacbr_api_key');
                  var button = $('.patsacbr-toggle-api-key');
                  var icon = button.find('.dashicons');
                  var isVisible = false;

                  button.on('click', function (event) {
                      event.preventDefault();
                      isVisible = !isVisible;
                      input.attr('type', isVisible ? 'text' : 'password');
                      icon.toggleClass('dashicons-visibility', !isVisible);
                      icon.toggleClass('dashicons-hidden', isVisible);
                  });
              });
          }(jQuery));
          ''', encoding='utf-8')

          (js_dir / 'order-metabox.js').write_text(r'''(function ($) {
              'use strict';

              $(function () {
                  var config = window.patsacbrOrderMetabox || {};
                  var strings = config.strings || {};

                  if (!config.ajaxUrl || !config.nonce) {
                      return;
                  }

                  function errorMessage(response, fallback) {
                      if (response && response.data && response.data.message) {
                          return response.data.message;
                      }
                      return fallback;
                  }

                  function request(button, action, orderId, busyText, resetText, fallbackError, options) {
                      options = options || {};
                      button.prop('disabled', true).text(busyText);

                      $.ajax({
                          url: config.ajaxUrl,
                          method: 'POST',
                          data: {
                              action: action,
                              order_id: orderId,
                              nonce: config.nonce
                          }
                      }).done(function (response) {
                          if (response && response.success) {
                              if (options.successMessage) {
                                  window.alert(options.successMessage);
                              }
                              if (options.reload !== false) {
                                  window.location.reload();
                                  return;
                              }
                          } else {
                              window.alert(errorMessage(response, fallbackError));
                          }
                          button.prop('disabled', false).text(resetText);
                      }).fail(function () {
                          window.alert(fallbackError);
                          button.prop('disabled', false).text(resetText);
                      });
                  }

                  $('.patsacbr-create-invoice').on('click', function () {
                      var button = $(this);
                      if (!window.confirm(strings.confirmCreate)) {
                          return;
                      }
                      request(button, 'patsacbr_manual_create_invoice', button.data('order-id'), strings.creating, strings.createLabel, strings.createError);
                  });

                  $('.patsacbr-void-invoice').on('click', function () {
                      var button = $(this);
                      if (!window.confirm(strings.confirmVoid)) {
                          return;
                      }
                      request(button, 'patsacbr_manual_void_invoice', button.data('order-id'), strings.voiding, strings.voidLabel, strings.voidError);
                  });

                  $('.patsacbr-send-invoice-email').on('click', function () {
                      var button = $(this);
                      if (!window.confirm(strings.confirmSend)) {
                          return;
                      }
                      request(button, 'patsacbr_send_invoice_email', button.data('order-id'), strings.sending, strings.sendLabel, strings.sendError, {
                          reload: false,
                          successMessage: strings.sendSuccess
                      });
                  });

                  $('.patsacbr-update-invoice').on('click', function () {
                      var button = $(this);
                      if (!window.confirm(strings.confirmUpdate)) {
                          return;
                      }
                      request(button, 'patsacbr_manual_update_invoice', button.data('order-id'), strings.updating, strings.updateLabel, strings.updateError);
                  });

                  $('.patsacbr-unlink-invoice').on('click', function () {
                      var button = $(this);
                      if (!window.confirm(strings.confirmUnlink)) {
                          return;
                      }
                      request(button, 'patsacbr_unlink_invoice', button.data('order-id'), strings.unlinking, strings.unlinkLabel, strings.unlinkError);
                  });
              });
          }(jQuery));
          ''', encoding='utf-8')

          # Enqueue settings JS only on the plugin settings screen.
          admin_text = admin_settings.read_text(encoding='utf-8')
          enqueue_style = "        wp_enqueue_style('patsacbr-admin-style', PATSACBR_PLUGIN_URL . 'admin/css/admin-style.css', array(), PATSACBR_VERSION);"
          if "admin/js/admin-settings.js" not in admin_text:
              admin_text = admin_text.replace(enqueue_style, enqueue_style + "\n        wp_enqueue_script('patsacbr-admin-settings', PATSACBR_PLUGIN_URL . 'admin/js/admin-settings.js', array('jquery'), PATSACBR_VERSION, true);")

          # Honor the deprecated pre-directory constant without declaring it ourselves.
          admin_text = admin_text.replace("if (defined('PATSACBR_LEXWARE_API_KEY')) {\n            return (string)$old_value;\n        }", "if (defined('PATSACBR_LEXWARE_API_KEY') || defined('LEXWARE_CONNECTOR_API_KEY')) {\n            return (string)$old_value;\n        }")
          admin_text = admin_text.replace("$api_key_from_constant = defined('PATSACBR_LEXWARE_API_KEY');\n        $api_key = $api_key_from_constant ? sanitize_text_field(trim((string)PATSACBR_LEXWARE_API_KEY)) : get_option('patsacbr_api_key', '');", "$api_key_from_constant = defined('PATSACBR_LEXWARE_API_KEY') || defined('LEXWARE_CONNECTOR_API_KEY');\n        if (defined('PATSACBR_LEXWARE_API_KEY')) {\n            $api_key = sanitize_text_field(trim((string) PATSACBR_LEXWARE_API_KEY));\n        } elseif (defined('LEXWARE_CONNECTOR_API_KEY')) {\n            $api_key = sanitize_text_field(trim((string) LEXWARE_CONNECTOR_API_KEY));\n        } else {\n            $api_key = get_option('patsacbr_api_key', '');\n        }")
          admin_settings.write_text(admin_text, encoding='utf-8')

          # Enqueue order metabox assets only on WooCommerce order screens.
          integration_text = integration.read_text(encoding='utf-8')
          register_marker = "    private function register_admin_hooks() {\n"
          if "enqueue_order_admin_assets" not in integration_text:
              integration_text = integration_text.replace(register_marker, register_marker + "        add_action('admin_enqueue_scripts', array($this, 'enqueue_order_admin_assets'));\n")

              method = r'''    public function enqueue_order_admin_assets($hook_suffix) {
                  unset($hook_suffix);
                  if (!function_exists('get_current_screen')) {
                      return;
                  }
                  $screen = get_current_screen();
                  if (!$screen || ('shop_order' !== $screen->post_type && 'woocommerce_page_wc-orders' !== $screen->id)) {
                      return;
                  }

                  wp_enqueue_style('patsacbr-order-admin', PATSACBR_PLUGIN_URL . 'admin/css/admin-style.css', array(), PATSACBR_VERSION);
                  wp_enqueue_script('patsacbr-order-metabox', PATSACBR_PLUGIN_URL . 'admin/js/order-metabox.js', array('jquery'), PATSACBR_VERSION, true);
                  wp_localize_script(
                      'patsacbr-order-metabox',
                      'patsacbrOrderMetabox',
                      array(
                          'ajaxUrl' => admin_url('admin-ajax.php'),
                          'nonce' => wp_create_nonce('patsacbr_manual_action'),
                          'strings' => array(
                              'confirmCreate' => __('Rechnung jetzt für diese Bestellung erstellen?', 'patsch9-accounting-bridge'),
                              'creating' => __('Wird erstellt...', 'patsch9-accounting-bridge'),
                              'createLabel' => __('✨ Rechnung jetzt erstellen', 'patsch9-accounting-bridge'),
                              'createError' => __('Fehler beim Erstellen der Rechnung', 'patsch9-accounting-bridge'),
                              'confirmVoid' => __('Rechnung wirklich stornieren?', 'patsch9-accounting-bridge'),
                              'voiding' => __('Wird storniert...', 'patsch9-accounting-bridge'),
                              'voidLabel' => __('Rechnung stornieren', 'patsch9-accounting-bridge'),
                              'voidError' => __('Fehler beim Stornieren der Rechnung', 'patsch9-accounting-bridge'),
                              'confirmSend' => __('Rechnung jetzt per E-Mail an den Kunden senden?', 'patsch9-accounting-bridge'),
                              'sending' => __('Wird gesendet...', 'patsch9-accounting-bridge'),
                              'sendLabel' => __('📧 Rechnung per E-Mail senden', 'patsch9-accounting-bridge'),
                              'sendError' => __('Fehler beim E-Mail-Versand', 'patsch9-accounting-bridge'),
                              'sendSuccess' => __('E-Mail wurde versendet', 'patsch9-accounting-bridge'),
                              'confirmUpdate' => __('Rechnung aktualisieren? Die bestehende finalisierte Rechnung wird in Lexware über eine verknüpfte Gutschrift korrigiert und anschließend neu erstellt. Bei Rechnungsentwürfen ist diese automatische Korrektur nicht möglich.', 'patsch9-accounting-bridge'),
                              'updating' => __('Wird aktualisiert...', 'patsch9-accounting-bridge'),
                              'updateLabel' => __('🔄 Rechnung aktualisieren', 'patsch9-accounting-bridge'),
                              'updateError' => __('Fehler beim Aktualisieren der Rechnung', 'patsch9-accounting-bridge'),
                              'confirmUnlink' => __("Verknüpfung zur Lexware-Rechnung wirklich löschen?\n\nDie Rechnung in Lexware bleibt bestehen, aber du kannst eine neue Rechnung für diese Bestellung erstellen.", 'patsch9-accounting-bridge'),
                              'unlinking' => __('Wird gelöscht...', 'patsch9-accounting-bridge'),
                              'unlinkLabel' => __('🔗 Verknüpfung löschen', 'patsch9-accounting-bridge'),
                              'unlinkError' => __('Fehler beim Löschen der Verknüpfung', 'patsch9-accounting-bridge'),
                          ),
                      )
                  );
              }

'''
              integration_text = integration_text.replace("    public function add_order_metabox() {", method + "    public function add_order_metabox() {")

          # Scope the bulk-action notice to WooCommerce order list screens.
          bulk_marker = "function patsacbr_bulk_action_admin_notice() {\n"
          if bulk_marker in integration_text and "patsacbr_bulk_action_admin_notice() {\n    $screen" not in integration_text:
              integration_text = integration_text.replace(bulk_marker, bulk_marker + "    $screen = function_exists('get_current_screen') ? get_current_screen() : null;\n    if (!$screen || ('edit-shop_order' !== $screen->id && 'woocommerce_page_wc-orders' !== $screen->id)) {\n        return;\n    }\n")
          integration.write_text(integration_text, encoding='utf-8')

          # Extend the existing admin stylesheet instead of printing a <style> tag.
          css = root / 'admin/css/admin-style.css'
          css_text = css.read_text(encoding='utf-8').rstrip() + '\n\n'
          if '.patsacbr-metabox p' not in css_text:
              css_text += '''.patsacbr-metabox p { margin: 10px 0; }
          .patsacbr-metabox code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 11px; word-break: break-all; }
          .patsacbr-metabox .button { width: 100%; text-align: center; box-sizing: border-box; }
          .patsacbr-manual-invoice-fields input.widefat { width: 100%; box-sizing: border-box; }
          '''
          css.write_text(css_text, encoding='utf-8')

          # Limit the completion notice to the Accounting Bridge settings page.
          reconciler = root / 'includes/class-invoice-reconciler.php'
          reconciler_text = reconciler.read_text(encoding='utf-8')
          notice_marker = "    public function render_completion_notice() {\n        if (!current_user_can('manage_woocommerce') || 'yes' !== get_option('patsacbr_invoice_reconciliation_notice_pending', 'no')) {\n            return;\n        }\n"
          scoped_notice = notice_marker + "\n        $screen = function_exists('get_current_screen') ? get_current_screen() : null;\n        if (!$screen || 'woocommerce_page_patsacbr-settings' !== $screen->id) {\n            return;\n        }\n"
          if notice_marker in reconciler_text and scoped_notice not in reconciler_text:
              reconciler_text = reconciler_text.replace(notice_marker, scoped_notice)
          reconciler.write_text(reconciler_text, encoding='utf-8')

          # API key compatibility: prefer the new prefixed constant, read the legacy constant only during transition.
          api = root / 'includes/class-lexware-api-client.php'
          api_text = api.read_text(encoding='utf-8')
          api_old = "        $key = defined('PATSACBR_LEXWARE_API_KEY')\n            ? (string) PATSACBR_LEXWARE_API_KEY\n            : (string) get_option('patsacbr_api_key', '');"
          api_new = "        if (defined('PATSACBR_LEXWARE_API_KEY')) {\n            $key = (string) PATSACBR_LEXWARE_API_KEY;\n        } elseif (defined('LEXWARE_CONNECTOR_API_KEY')) {\n            // Legacy pre-directory constant: read-only compatibility, never declared by this plugin.\n            $key = (string) LEXWARE_CONNECTOR_API_KEY;\n        } else {\n            $key = (string) get_option('patsacbr_api_key', '');\n        }"
          if api_old in api_text:
              api_text = api_text.replace(api_old, api_new)
          api.write_text(api_text, encoding='utf-8')

          # Generate a narrowly scoped legacy data migration. All new writes use patsacbr_/PATSACBR_.
          option_lines = '\n'.join("        '%s'," % s for s in option_suffixes)
          meta_lines = '\n'.join("        '%s'," % s for s in meta_suffixes)
          migration = f'''<?php
          /**
           * One-time compatibility migration for pre-WordPress.org builds.
           *
           * Legacy three-character identifiers are referenced only to migrate data
           * written by versions <= 2026.10.2. New data always uses patsacbr_.
           */

          if (!defined('ABSPATH')) {{
              exit;
          }}

          final class PATSACBR_Legacy_Migration {{
              const VERSION = '1';
              const LEGACY_OPTION_PREFIX = 'wlc_';
              const LEGACY_META_PREFIX = '_wlc_';
              const OPTION_PREFIX = 'patsacbr_';
              const META_PREFIX = '_patsacbr_';

              private static $option_suffixes = array(
          {option_lines}
              );

              private static $order_meta_suffixes = array(
          {meta_lines}
              );

              public static function run() {{
                  self::register_order_meta_fallbacks();

                  if (self::VERSION === (string) get_option('patsacbr_prefix_migration_version', '')) {{
                      return;
                  }}

                  foreach (self::$option_suffixes as $suffix) {{
                      self::migrate_option(self::LEGACY_OPTION_PREFIX . $suffix, self::OPTION_PREFIX . $suffix);
                  }}

                  if (function_exists('WC') && WC() && WC()->payment_gateways()) {{
                      foreach (WC()->payment_gateways->payment_gateways() as $gateway) {{
                          if (!is_object($gateway) || empty($gateway->id)) {{
                              continue;
                          }}
                          $gateway_id = sanitize_key((string) $gateway->id);
                          self::migrate_option(self::LEGACY_OPTION_PREFIX . 'payment_terms_' . $gateway_id, self::OPTION_PREFIX . 'payment_terms_' . $gateway_id);
                          self::migrate_option(self::LEGACY_OPTION_PREFIX . 'payment_due_days_' . $gateway_id, self::OPTION_PREFIX . 'payment_due_days_' . $gateway_id);
                      }}
                  }}

                  self::cleanup_legacy_schedules();
                  update_option('patsacbr_prefix_migration_version', self::VERSION, false);
              }}

              private static function migrate_option($legacy_key, $new_key) {{
                  $sentinel = '__patsacbr_missing_option__';
                  if ($sentinel !== get_option($new_key, $sentinel)) {{
                      return;
                  }}
                  $legacy_value = get_option($legacy_key, $sentinel);
                  if ($sentinel === $legacy_value) {{
                      return;
                  }}
                  update_option($new_key, $legacy_value, false);
                  delete_option($legacy_key);
              }}

              private static function register_order_meta_fallbacks() {{
                  foreach (self::$order_meta_suffixes as $suffix) {{
                      add_filter('woocommerce_order_get_' . self::META_PREFIX . $suffix, array(__CLASS__, 'migrate_order_meta_on_read'), 10, 2);
                  }}
              }}

              public static function migrate_order_meta_on_read($value, $order) {{
                  if (!$order instanceof WC_Order) {{
                      return $value;
                  }}

                  $hook_prefix = 'woocommerce_order_get_' . self::META_PREFIX;
                  $hook = current_filter();
                  if (0 !== strpos($hook, $hook_prefix)) {{
                      return $value;
                  }}

                  $suffix = substr($hook, strlen($hook_prefix));
                  if (!in_array($suffix, self::$order_meta_suffixes, true)) {{
                      return $value;
                  }}

                  $new_key = self::META_PREFIX . $suffix;
                  if ($order->meta_exists($new_key)) {{
                      return $value;
                  }}

                  $legacy_key = self::LEGACY_META_PREFIX . $suffix;
                  $legacy_value = $order->get_meta($legacy_key, true, 'edit');
                  if ('' === $legacy_value || null === $legacy_value) {{
                      return $value;
                  }}

                  $order->update_meta_data($new_key, $legacy_value);
                  $order->delete_meta_data($legacy_key);
                  $order->save_meta_data();
                  return $legacy_value;
              }}

              public static function migrate_queue_table() {{
                  global $wpdb;
                  $legacy_table = $wpdb->prefix . 'wlc_queue';
                  $new_table = $wpdb->prefix . 'patsacbr_queue';

                  $legacy_exists = $wpdb->get_var($wpdb->prepare('SHOW TABLES LIKE %s', $wpdb->esc_like($legacy_table))); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- one-time migration of a plugin-owned table.
                  if ($legacy_table !== $legacy_exists) {{
                      return;
                  }}

                  $result = $wpdb->query($wpdb->prepare('INSERT IGNORE INTO %i SELECT * FROM %i', $new_table, $legacy_table)); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- migration between plugin-owned tables.
                  if (false !== $result) {{
                      $wpdb->query($wpdb->prepare('DROP TABLE IF EXISTS %i', $legacy_table)); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.SchemaChange,WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- legacy plugin-owned table is removed only after a successful copy.
                  }}
              }}

              private static function cleanup_legacy_schedules() {{
