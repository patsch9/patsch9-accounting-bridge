name: Build reconciliation test package

on:
  push:
    paths:
      - '.github/workflows/build-reconciliation-test-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build installable WordPress ZIP
        shell: bash
        run: |
          set -euo pipefail
          SLUG='patsch9-accounting-bridge'
          VERSION='2026.10.2'
          rm -rf .test-build
          mkdir -p ".test-build/${SLUG}"
          rsync -a ./ ".test-build/${SLUG}/" --exclude-from='.distignore' --exclude='.test-build/'
          test -f ".test-build/${SLUG}/patsch9-accounting-bridge.php"
          grep -q 'Version: 2026.10.2' ".test-build/${SLUG}/patsch9-accounting-bridge.php"
          (
            cd .test-build
            zip -qr "${SLUG}-${VERSION}-test.zip" "${SLUG}"
            sha256sum "${SLUG}-${VERSION}-test.zip" > "${SLUG}-${VERSION}-test.zip.sha256"
          )
      - uses: actions/upload-artifact@v7
        with:
          name: patsch9-accounting-bridge-2026.10.2-test
          path: |
            .test-build/patsch9-accounting-bridge-2026.10.2-test.zip
            .test-build/patsch9-accounting-bridge-2026.10.2-test.zip.sha256
          if-no-files-found: error
          retention-days: 7
