name: Apply historical invoice reconciliation

on:
  push:
    branches:
      - feature/historical-invoice-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/historical-invoice-reconciliation
          fetch-depth: 0

      - name: Apply integration changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          api_methods = r'''    /**
           * Returns whether a usable Lexware API key is configured.
           *
           * @return bool
           */
          public function is_configured() {
              return '' !== $this->api_key;
          }

          /**
           * Normalize Lexware formatted text for deterministic matching.
           *
           * @param string $text Source text.
           * @return string
           */
          private function normalize_reconciliation_text($text) {
              $text = html_entity_decode(wp_strip_all_tags((string) $text), ENT_QUOTES | ENT_HTML5, get_bloginfo('charset') ?: 'UTF-8');
              $text = preg_replace('/\s+/u', ' ', $text);
              return is_string($text) ? trim($text) : '';
          }

          /**
           * Check whether the complete WooCommerce order number occurs in the
           * invoice introduction. Unicode letter/number boundaries prevent order
           * 123 from matching 1123 or 1234.
           *
           * @param string $introduction Lexware invoice introduction.
           * @param string $order_number WooCommerce order number.
           * @return bool
           */
          private function introduction_contains_order_number($introduction, $order_number) {
              $introduction = $this->normalize_reconciliation_text($introduction);
              $order_number = trim((string) $order_number);
              if ('' === $introduction || '' === $order_number || strlen($order_number) > 191) {
                  return false;
              }

              $pattern = '/(?<![\p{L}\p{N}])' . preg_quote($order_number, '/') . '(?![\p{L}\p{N}])/u';
              return 1 === preg_match($pattern, $introduction);
          }

          /**
           * Find an already existing Lexware invoice for a WooCommerce order.
           *
           * The lookup is intentionally read-only and fail-closed. Voucherlist is
           * used for paging and amount preselection; full invoice details are then
           * retrieved because Lexware does not expose the introduction as a
           * voucherlist filter.
           *
           * @param WC_Order $order WooCommerce order.
           * @param int      $cutoff_timestamp Upper date boundary for historical reconciliation.
           * @return array|null|WP_Error Full invoice data, null for a confirmed non-match, or error.
           */
          public function find_invoice_by_order($order, $cutoff_timestamp = 0) {
              if (!$order instanceof WC_Order) {
                  return new WP_Error('invalid_order', __('Ungültige Bestellung für die Lexware-Rechnungssuche.', 'patsch9-accounting-bridge'), array('retryable' => false));
              }
              if (!$this->is_configured()) {
                  return new WP_Error('no_api_key', __('Kein gültiger API-Key konfiguriert', 'patsch9-accounting-bridge'), array('retryable' => false));
              }

              $created = $order->get_date_created();
              $order_number = trim((string) $order->get_order_number());
              if (!$created || '' === $order_number) {
                  return new WP_Error('missing_order_reference', __('Die Bestellung besitzt keine auswertbare Bestellnummer oder kein Erstellungsdatum.', 'patsch9-accounting-bridge'), array('retryable' => false));
              }

              $order_total = round((float) $order->get_total(), 2);
              $before_days = max(0, min(31, absint(apply_filters('wlc_reconciliation_days_before_order', 7, $order))));
              $after_days = max(1, min(730, absint(apply_filters('wlc_reconciliation_days_after_order', 180, $order))));
              $from_ts = $created->getTimestamp() - ($before_days * DAY_IN_SECONDS);
              $to_ts = $created->getTimestamp() + ($after_days * DAY_IN_SECONDS);
              if ($cutoff_timestamp > 0) {
                  $to_ts = min($to_ts, absint($cutoff_timestamp));
              }
              if ($to_ts < $from_ts) {
                  $to_ts = $from_ts;
              }

              $from = wp_date('Y-m-d', $from_ts, wp_timezone());
              $to = wp_date('Y-m-d', $to_ts, wp_timezone());
              $matches = array();
              $page = 0;
              $max_pages = 20;

              do {
                  $query = http_build_query(array(
                      'voucherType' => 'invoice',
                      'voucherStatus' => 'any',
                      'voucherDateFrom' => $from,
                      'voucherDateTo' => $to,
                      'size' => 250,
                      'page' => $page,
                      'sort' => 'voucherDate,ASC',
                  ), '', '&', PHP_QUERY_RFC3986);
                  $list = $this->request('GET', 'voucherlist?' . $query);
                  if (is_wp_error($list)) {
                      return $list;
                  }
                  if (!isset($list['content']) || !is_array($list['content'])) {
                      return new WP_Error('invalid_voucherlist_response', __('Lexware hat bei der historischen Rechnungssuche keine gültige Belegliste geliefert.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                  }

                  foreach ($list['content'] as $candidate) {
                      if (!is_array($candidate) || 'invoice' !== strtolower((string) ($candidate['voucherType'] ?? ''))) {
                          continue;
                      }
                      if (!isset($candidate['totalAmount']) || abs(round((float) $candidate['totalAmount'], 2) - $order_total) > 0.02) {
                          continue;
                      }

                      $invoice_id = sanitize_text_field((string) ($candidate['id'] ?? ''));
                      if (!$this->is_valid_uuid($invoice_id)) {
                          return new WP_Error('invalid_invoice_search_id', __('Lexware hat bei der historischen Rechnungssuche eine ungültige Rechnungs-ID geliefert.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                      }

                      $details = $this->request('GET', 'invoices/' . rawurlencode($invoice_id));
                      if (is_wp_error($details)) {
                          return $details;
                      }
                      if (!isset($details['totalPrice']['totalGrossAmount'])) {
                          return new WP_Error('invalid_invoice_search_response', __('Lexware hat bei der historischen Rechnungssuche unvollständige Rechnungsdaten geliefert.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                      }
                      if (abs(round((float) $details['totalPrice']['totalGrossAmount'], 2) - $order_total) > 0.02) {
                          continue;
                      }
                      if (!$this->introduction_contains_order_number((string) ($details['introduction'] ?? ''), $order_number)) {
                          continue;
                      }

                      $details_id = sanitize_text_field((string) ($details['id'] ?? ''));
                      if (!$this->is_valid_uuid($details_id) || $details_id !== $invoice_id) {
                          return new WP_Error('invoice_identity_mismatch', __('Lexware hat widersprüchliche Rechnungsdaten geliefert. Die Bestellung wurde nicht automatisch verknüpft.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                      }
                      $matches[$invoice_id] = $details;
                  }

                  $total_pages = isset($list['totalPages']) ? absint($list['totalPages']) : 1;
                  if ($total_pages > $max_pages) {
                      return new WP_Error('invoice_search_too_broad', __('Der Lexware-Suchzeitraum enthält zu viele Rechnungen für einen sicheren automatischen Abgleich. Bitte die Bestellung manuell prüfen oder den Suchzeitraum per Filter einschränken.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                  }
                  $page++;
              } while ($page < $total_pages);

              if (!$matches) {
                  return null;
              }

              $usable = array();
              $voided = array();
              foreach ($matches as $invoice_id => $invoice) {
                  $status = strtolower((string) ($invoice['voucherStatus'] ?? ''));
                  if ('draft' === $status) {
                      return new WP_Error('draft_invoice_match', __('Zu dieser Bestellung wurde in Lexware ein passender Rechnungsentwurf gefunden. Aus Schutz vor Doppelbelegen ist eine manuelle Prüfung erforderlich.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
                  }
                  if ('voided' === $status) {
                      $voided[$invoice_id] = $invoice;
                  } else {
                      $usable[$invoice_id] = $invoice;
                  }
              }

              if (1 === count($usable) && count($matches) === (1 + count($voided))) {
                  return reset($usable);
              }
              if (0 === count($usable) && 1 === count($voided)) {
                  return reset($voided);
              }
              if (1 === count($matches)) {
                  return reset($matches);
              }

              return new WP_Error('ambiguous_invoice_match', __('In Lexware wurden mehrere Rechnungen gefunden, die Bestellnummer und Gesamtbetrag dieser Bestellung enthalten. Es wurde keine automatische Zuordnung vorgenommen.', 'patsch9-accounting-bridge'), array('retryable' => false, 'manual_check' => true));
          }

          '''

          replace_once(
              'includes/class-lexware-api-client.php',
              "    private function request($method, $endpoint, $data = null, $raw_response = false, $accept = null) {\n",
              api_methods + "    private function request($method, $endpoint, $data = null, $raw_response = false, $accept = null) {\n",
          )

          replace_once(
              'includes/class-queue-handler.php',
              "            $ambiguous = is_array($data) && !empty($data['ambiguous_write']);\n            $this->mark_as_failed($item, $result->get_error_message(), $retryable, $ambiguous);\n",
              "            $ambiguous = is_array($data) && !empty($data['ambiguous_write']);\n            $manual_check = is_array($data) && !empty($data['manual_check']);\n            $this->mark_as_failed($item, $result->get_error_message(), $retryable, ($ambiguous || $manual_check));\n",
          )
          replace_once(
              'includes/class-queue-handler.php',
              "        if ($existing) {\n            return array('id' => $existing);\n        }\n        $contact_id = null;\n",
              "        if ($existing) {\n            return array('id' => $existing);\n        }\n\n        // Historical orders may already have an invoice in Lexware from before\n        // this plugin managed the order. Reconcile read-only before any remote POST.\n        if (class_exists('WLC_Invoice_Reconciler')) {\n            $reconciled = WLC_Invoice_Reconciler::get_instance()->reconcile_before_create($order, $api_client);\n            if (is_wp_error($reconciled)) {\n                return $reconciled;\n            }\n            if (is_array($reconciled) && !empty($reconciled['id'])) {\n                return array(\n                    'skipped' => true,\n                    'reason'  => 'existing_invoice_reconciled',\n                    'id'      => sanitize_text_field((string) $reconciled['id']),\n                );\n            }\n        }\n\n        $contact_id = null;\n",
          )

          replace_once(
              'patsch9-accounting-bridge.php',
              " * Version: 2026.10.0\n",
              " * Version: 2026.10.1\n",
          )
          replace_once(
              'patsch9-accounting-bridge.php',
              "define('WLC_VERSION', '2026.10.0');\n",
              "define('WLC_VERSION', '2026.10.1');\n",
          )
          replace_once(
              'patsch9-accounting-bridge.php',
              "    require_once WLC_PLUGIN_DIR . 'includes/class-lexware-api-client.php';\n    require_once WLC_PLUGIN_DIR . 'includes/class-woo-lexware-integration.php';\n",
              "    require_once WLC_PLUGIN_DIR . 'includes/class-lexware-api-client.php';\n    require_once WLC_PLUGIN_DIR . 'includes/class-invoice-reconciler.php';\n    require_once WLC_PLUGIN_DIR . 'includes/class-woo-lexware-integration.php';\n",
          )
          replace_once(
              'patsch9-accounting-bridge.php',
              "        // WooCommerce-Integration\n        WLC_WooCommerce_Integration::get_instance();\n",
              "        // Historische Rechnungen im Hintergrund read-only zuordnen.\n        WLC_Invoice_Reconciler::get_instance();\n\n        // WooCommerce-Integration\n        WLC_WooCommerce_Integration::get_instance();\n",
          )
          replace_once(
              'patsch9-accounting-bridge.php',
              "        // Setze Standard-Einstellungen\n        $this->set_default_options();\n\n    }\n",
              "        // Setze Standard-Einstellungen\n        $this->set_default_options();\n\n        // Orders existing before this feature becomes active form the immutable\n        // historical reconciliation set. New orders are handled normally.\n        if (!get_option('wlc_invoice_reconciliation_cutoff', 0)) {\n            add_option('wlc_invoice_reconciliation_cutoff', time(), '', false);\n        }\n\n    }\n",
          )

          replace_once(
              'includes/class-woo-lexware-integration.php',
              "        $manual_entry = $order->get_meta('_wlc_manual_invoice_entry');\n",
              "        $manual_entry = $order->get_meta('_wlc_manual_invoice_entry');\n        $reconciled_entry = $order->get_meta('_wlc_lexware_invoice_reconciled');\n",
          )
          replace_once(
              'includes/class-woo-lexware-integration.php',
              "                <?php if ($manual_entry === 'yes'): ?>\n                    <p><em style=\"font-size: 11px; color: #666;\"><?php esc_html_e('(Manuell hinterlegt)', 'patsch9-accounting-bridge'); ?></em></p>\n                <?php endif; ?>\n",
              "                <?php if ($manual_entry === 'yes'): ?>\n                    <p><em style=\"font-size: 11px; color: #666;\"><?php esc_html_e('(Manuell hinterlegt)', 'patsch9-accounting-bridge'); ?></em></p>\n                <?php elseif ($reconciled_entry === 'yes'): ?>\n                    <p><em style=\"font-size: 11px; color: #666;\"><?php esc_html_e('(Automatisch aus Lexware ermittelt)', 'patsch9-accounting-bridge'); ?></em></p>\n                <?php endif; ?>\n",
          )
          replace_once(
              'includes/class-woo-lexware-integration.php',
              "    $order->delete_meta_data('_wlc_lexware_update_source_invoice_id');\n    $order->save();\n    \n    $order->add_order_note(esc_html__('Verknüpfung zur Lexware-Rechnung wurde entfernt.', 'patsch9-accounting-bridge'));\n",
              "    $order->delete_meta_data('_wlc_lexware_update_source_invoice_id');\n    $order->delete_meta_data('_wlc_lexware_invoice_reconciled');\n    $order->update_meta_data('_wlc_skip_auto_reconciliation', 'yes');\n    $order->update_meta_data('_wlc_lexware_reconciliation_state', 'manually_unlinked');\n    $order->save();\n    \n    $order->add_order_note(esc_html__('Verknüpfung zur Lexware-Rechnung wurde entfernt. Die automatische historische Wiederzuordnung ist für diese Bestellung deaktiviert.', 'patsch9-accounting-bridge'));\n",
          )

          replace_once(
              'includes/class-invoice-reconciler.php',
              "            as_unschedule_all_actions(self::HOOK, null, self::GROUP);\n",
              "            as_unschedule_all_actions(self::HOOK);\n",
          )

          replace_once(
              'README.md',
              "Aktuelle stabile Version: **2026.10.0**\n",
              "Entwicklungsstand: **2026.10.1**\n",
          )
          replace_once(
              'README.md',
              "- Automatische oder manuelle Rechnungserstellung aus WooCommerce-Bestellungen.\n",
              "- Automatische oder manuelle Rechnungserstellung aus WooCommerce-Bestellungen.\n- Automatischer read-only Abgleich historischer Bestellungen mit bereits vorhandenen Lexware-Rechnungen anhand Bestellnummer im Einleitungstext und identischem Bruttobetrag.\n",
          )
          replace_once(
              'README.md',
              "4. API-Key, Trigger-Status und gewünschte Synchronisationsoptionen konfigurieren.\n",
              "4. API-Key, Trigger-Status und gewünschte Synchronisationsoptionen konfigurieren.\n5. Nach Konfiguration des API-Keys startet der historische Rechnungsabgleich im Hintergrund. Wegen des Lexware-API-Limits wird er in kleinen Batches ausgeführt.\n",
          )

          replace_once(
              'readme.txt',
              "Stable tag: 2026.10.0\n",
              "Stable tag: 2026.10.1\n",
          )
          replace_once(
              'readme.txt',
              "* Automatic or manual invoice creation from WooCommerce orders.\n",
              "* Automatic or manual invoice creation from WooCommerce orders.\n* Read-only reconciliation of historical WooCommerce orders with existing Lexware invoices using the order number in the invoice introduction plus gross-total verification.\n",
          )
          replace_once(
              'readme.txt',
              "== Changelog ==\n\n= 2026.10.0 =\n",
              "== Changelog ==\n\n= 2026.10.1 =\n* Adds background reconciliation for orders that existed before the integration was active.\n* Existing Lexware invoices are linked only after an exact order-number match in the invoice introduction and gross-total verification.\n* Ambiguous matches and API lookup errors fail closed to prevent duplicate invoices.\n* Manual unlinking opts the order out of automatic historical relinking.\n\n= 2026.10.0 =\n",
          )

          replace_once(
              'CHANGELOG.md',
              "## Noch nicht veröffentlicht\n\nKeine Änderungen.\n",
              "## Noch nicht veröffentlicht\n\nKeine Änderungen.\n\n## 2026.10.1 – Noch nicht veröffentlicht\n\n- Historischer, rein lesender Abgleich bestehender WooCommerce-Bestellungen mit bereits vorhandenen Lexware-Rechnungen.\n- Eindeutige Zuordnung nur bei exakter Bestellnummer im Lexware-Einleitungstext und identischem Bruttobetrag.\n- Hintergrundverarbeitung in kleinen Batches unter Beachtung des Lexware-API-Limits.\n- Fail-closed-Verhalten bei API-Fehlern, Rechnungsentwürfen oder mehrdeutigen Treffern zum Schutz vor Doppelbelegen.\n- Zusätzlicher Abgleich unmittelbar vor einer Rechnungserstellung für historische Bestellungen.\n- Bewusst gelöschte Rechnungsverknüpfungen werden nicht automatisch erneut hergestellt.\n",
          )

          Path('.github/workflows/apply-historical-reconciliation.yml').unlink()

      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit feature integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add historical Lexware invoice reconciliation"
          git push origin HEAD:feature/historical-invoice-reconciliation
