name: Apply 2026.10.8 hardening patch

on:
  push:
    branches:
      - fix/2026.10.8-tax-temp-hardening
    paths:
      - .github/workflows/apply-2026-10-8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2026.10.8-tax-temp-hardening
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply reviewed patch
        run: python3 tools/apply-2026-10-8.py
      - name: Validate patched sources
        shell: bash
        run: |
          php -l includes/class-lexware-api-client.php
          php -l tests/test-rental-meta.php
          php tests/test-rental-meta.php
          grep -q "Version: 2026.10.8" patsch9-accounting-bridge.php
          grep -q "Stable tag: 2026.10.8" readme.txt
          ! grep -q 'private $last_request_time' includes/class-lexware-api-client.php
          ! grep -q "private function get_total_discount" includes/class-lexware-api-client.php
          ! grep -q "private function calculate_items_subtotal" includes/class-lexware-api-client.php
          ! grep -q "private function get_average_tax_rate_for_items" includes/class-lexware-api-client.php
      - name: Commit reviewed patch and remove helpers
        shell: bash
        run: |
          rm .github/workflows/apply-2026-10-8.yml tools/apply-2026-10-8.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden historical tax and invoice temp files for 2026.10.8"
          git push origin HEAD:fix/2026.10.8-tax-temp-hardening
