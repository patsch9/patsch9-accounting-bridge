name: Prepare reconciliation control version

on:
  push:
    paths:
      - '.github/workflows/prepare-reconciliation-control-version.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/manual-reconciliation-control
      - name: Update version metadata
        shell: python
        run: |
          from pathlib import Path

          plugin = Path('patsch9-accounting-bridge.php')
          text = plugin.read_text(encoding='utf-8')
          text = text.replace('Version: 2026.10.1', 'Version: 2026.10.2', 1)
          text = text.replace("define('WLC_VERSION', '2026.10.1');", "define('WLC_VERSION', '2026.10.2');", 1)
          plugin.write_text(text, encoding='utf-8')

          readme = Path('readme.txt')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Stable tag: 2026.10.1', 'Stable tag: 2026.10.2', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = "## Noch nicht veröffentlicht\n\nKeine Änderungen.\n"
          new = "## Noch nicht veröffentlicht\n\nKeine Änderungen.\n\n## 2026.10.2 – Noch nicht veröffentlicht\n\n- Manueller Start und Neustart des historischen Lexware-Rechnungsabgleichs in der Accounting-Bridge-Administration.\n- Sichtbarer Status mit Batch-Fortschritt, Treffern, Nicht-Treffern und Fehlern.\n- Manuelle Neustarts prüfen auch bereits ohne Treffer geprüfte Bestellungen erneut, verändern aber keine bestehenden Rechnungsverknüpfungen.\n- Action-Scheduler-Aufräumung berücksichtigt die eigene Scheduler-Gruppe korrekt.\n"
          if old not in text:
              raise SystemExit('CHANGELOG insertion point not found')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Patrick Schmidt'
          git config user.email '47031716+patsch9@users.noreply.github.com'
          git add patsch9-accounting-bridge.php readme.txt CHANGELOG.md
          git diff --cached --check
          git commit -m 'Prepare 2026.10.2 reconciliation controls'
          git push origin HEAD:feature/manual-reconciliation-control
