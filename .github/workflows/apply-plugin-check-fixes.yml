name: Apply Plugin Check source fixes

on:
  push:
    branches:
      - fix/plugin-check-2026-10-06

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plugin-check-2026-10-06
          fetch-depth: 0
      - name: Apply targeted source fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('includes/class-lexware-api-client.php')
          text = path.read_text(encoding='utf-8')
          old = """            $decoded = json_decode($body, true);\n            $message = is_array($decoded) && !empty($decoded['message']) ? sanitize_text_field((string) $decoded['message']) : sprintf(__('Lexware API Fehler (HTTP %d)', 'patsch9-accounting-bridge'), $status);\n            $message = function_exists('mb_substr') ? mb_substr($message, 0, 500) : substr($message, 0, 500);"""
          new = """            $decoded = json_decode($body, true);\n            if (is_array($decoded) && !empty($decoded['message'])) {\n                $message = sanitize_text_field((string) $decoded['message']);\n            } else {\n                /* translators: %d: HTTP status code returned by the Lexware Office API. */\n                $message = sprintf(__('Lexware API Fehler (HTTP %d)', 'patsch9-accounting-bridge'), $status);\n            }\n            $message = function_exists('mb_substr') ? mb_substr($message, 0, 500) : substr($message, 0, 500);"""
          if text.count(old) != 1:
              raise SystemExit('Expected Lexware HTTP error block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The workflow is intentionally one-shot and removes itself in the fix commit.
          Path('.github/workflows/apply-plugin-check-fixes.yml').unlink()
          PY
          php -l includes/class-lexware-api-client.php
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-lexware-api-client.php .github/workflows/apply-plugin-check-fixes.yml
          git commit -m "Fix Plugin Check i18n finding [autofix]"
          git push origin HEAD:fix/plugin-check-2026-10-06
