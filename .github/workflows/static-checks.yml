name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        if: matrix.php == '8.2'
        shell: bash
        run: |
          find . -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  wordpress-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          exclude-directories: |
            .github
          exclude-files: |
            .distignore
            VERSIONING.md
            DOCUMENTATION.md
            MIGRATION.md
