name: Static checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: ${{ matrix.php == '8.2' && 'wp-cli:2.12.0' || 'none' }}
      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Rental metadata export regressions
        run: php tests/test-rental-meta.php
      - name: JavaScript syntax
        if: matrix.php == '8.2'
        shell: bash
        run: |
          find . -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Translation catalog integrity
        if: matrix.php == '8.2'
        shell: bash
        run: |
          wp i18n make-pot . /tmp/patsacbr-source.pot --domain=patsch9-accounting-bridge --slug=patsch9-accounting-bridge --exclude=.github,tests
          wp i18n make-mo languages/patsch9-accounting-bridge-de_DE.po /tmp/patsacbr-de_DE.mo
          python3 tests/check-translations.py --pot /tmp/patsacbr-source.pot --mo /tmp/patsacbr-de_DE.mo

  wordpress-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          strict: true
          exclude-directories: |
            .github
            tests
          exclude-files: |
            .distignore
            VERSIONING.md
            DOCUMENTATION.md
            MIGRATION.md

  migration-and-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-wp-env-11.16.0
      - name: Install pinned WordPress test harness
        run: npm -g --no-fund --prefer-offline install @wordpress/env@11.16.0
      - name: Configure disposable test environment
        run: |
          cat > .wp-env.json <<EOF
          {"core": null, "testsEnvironment": false, "mappings": {"wp-content/plugins/patsch9-accounting-bridge": "$PWD"}}
          EOF
          wp-env start
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate patsch9-accounting-bridge
      - name: Migration and order locks against a real database
        run: wp-env run cli env PATSACBR_RUN_UPGRADE_TESTS=1 wp eval-file wp-content/plugins/patsch9-accounting-bridge/tests/test-upgrade-locks.php
