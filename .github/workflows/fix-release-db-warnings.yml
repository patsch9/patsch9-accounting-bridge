name: Fix accounting release DB warnings

on:
  push:
    branches:
      - chore/automated-releases

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/automated-releases

      - name: Document intentional database access
        shell: python
        run: |
          from pathlib import Path
          import re

          queue_path = Path('includes/class-queue-handler.php')
          text = queue_path.read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []
          direct_call = re.compile(r'\$wpdb->(?:get_var|get_col|get_row|get_results|insert|update|delete|query)\s*\(')
          for line in lines:
              if direct_call.search(line):
                  previous = out[-1] if out else ''
                  if 'WordPress.DB.DirectDatabaseQuery.' not in previous and 'phpcs:ignore WordPress.DB.DirectDatabaseQuery.' not in line:
                      indent = re.match(r'\s*', line).group(0)
                      out.append(
                          indent
                          + '// phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- '
                          + 'Plugin-owned transactional queue state must be read/written fresh for deduplication and atomic worker claiming; WordPress provides no CRUD API for this table.'
                      )
              out.append(line)
          queue_path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          admin_path = Path('includes/class-admin-settings.php')
          text = admin_path.read_text(encoding='utf-8')
          old = "        $deleted = $wpdb->query(\n"
          new = (
              "        // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- "
              "Explicit nonce/capability-protected cleanup of the plugin-owned queue table must take effect immediately.\n"
              "        $deleted = $wpdb->query(\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected one queue cleanup query, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              "        ); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching\n\n        wp_safe_redirect",
              "        );\n\n        wp_safe_redirect",
              1,
          )
          admin_path.write_text(text, encoding='utf-8')

          uninstall_path = Path('uninstall.php')
          text = uninstall_path.read_text(encoding='utf-8')

          old = "    $wpdb->query($wpdb->prepare(\n        \"DELETE FROM %i WHERE option_name LIKE %s\","
          new = (
              "    // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- "
              "Explicit opt-in uninstall cleanup of dynamically named plugin options; cached state is irrelevant during removal.\n"
              "    $wpdb->query($wpdb->prepare(\n        \"DELETE FROM %i WHERE option_name LIKE %s\","
          )
          if text.count(old) != 1:
              raise SystemExit('Dynamic option cleanup query not found exactly once.')
          text = text.replace(old, new, 1)
          text = text.replace(
              "    )); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching\n}\n\n$table =",
              "    ));\n}\n\n$table =",
              1,
          )

          old = '$wpdb->query($wpdb->prepare("DROP TABLE IF EXISTS %i", $table)); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.SchemaChange'
          new = '$wpdb->query($wpdb->prepare("DROP TABLE IF EXISTS %i", $table)); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.SchemaChange,WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- Explicit opt-in uninstall cleanup of the plugin-owned queue table.'
          if text.count(old) != 1:
              raise SystemExit('Queue DROP TABLE statement not found exactly once.')
          text = text.replace(old, new, 1)

          old = "$wpdb->delete($hpos_meta_table, array('meta_key' => $meta_key), array('%s')); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching"
          new = "$wpdb->delete($hpos_meta_table, array('meta_key' => $meta_key), array('%s')); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching,WordPress.DB.SlowDBQuery.slow_db_query_meta_key -- One-time explicit opt-in uninstall cleanup of plugin metadata when WooCommerce may already be inactive."
          if text.count(old) != 1:
              raise SystemExit('HPOS metadata cleanup statement not found exactly once.')
          text = text.replace(old, new, 1)

          old = "    $wpdb->query($wpdb->prepare(\n        \"DELETE FROM {$wpdb->options} WHERE option_name LIKE %s\","
          new = (
              "    // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- "
              "Explicit opt-in uninstall cleanup of plugin rate-limit transients; cached state is irrelevant during removal.\n"
              "    $wpdb->query($wpdb->prepare(\n        \"DELETE FROM {$wpdb->options} WHERE option_name LIKE %s\","
          )
          if text.count(old) != 1:
              raise SystemExit('Rate-limit transient cleanup query not found exactly once.')
          text = text.replace(old, new, 1)
          suffix = "    )); // phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching\n}"
          if text.count(suffix) != 1:
              raise SystemExit('Final transient cleanup suppression not found exactly once.')
          text = text.replace(suffix, "    ));\n}", 1)
          uninstall_path.write_text(text, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-queue-handler.php includes/class-admin-settings.php uninstall.php
          git commit -m "Document intentional accounting database access"
          git push origin HEAD:chore/automated-releases
